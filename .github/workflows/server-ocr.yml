name: OCR server CPU tests

on:
  pull_request:
    branches: [main]
    paths: ['server/ocr/**', '.github/workflows/server-ocr.yml']
  push:
    branches: [main]
    paths: ['server/ocr/**', '.github/workflows/server-ocr.yml']

permissions:
  contents: read

jobs:
  ocr-server-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the test font and CPU-only dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          python -m pip install -r server/ocr/requirements-test.txt
      - name: Run bounded document API and PDF tests
        run: server/ocr/test.sh
