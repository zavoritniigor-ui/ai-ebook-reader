name: Ebook Reader CI

on:
  push:
    branches: [ "main", "dev", "staging", "test" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking standalone JS files..."
          for js_file in js/*.js; do node --check "$js_file"; done
          python3 tests/app_shell_versions.py
          python3 tests/browser_cdp_transport.py
          python3 tests/ci_suite_coverage.py
          node --check sw.js
          node --check archive-guard.worker.js
          
          echo "Extracting inline JS from index.html..."
          python3 -c '
          import html.parser
          import sys

          class ScriptExtractor(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.scripts = []
                  self.current_script = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      is_src = any(attr[0] == "src" for attr in attrs)
                      type_attr = next((attr[1] for attr in attrs if attr[0] == "type"), "text/javascript")
                      if not is_src and type_attr in ("text/javascript", "module", "application/javascript"):
                          self.in_script = True
                          self.current_script = []
              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.in_script = False
                      self.scripts.append("".join(self.current_script))
              def handle_data(self, data):
                  if self.in_script:
                      self.current_script.append(data)

          with open("index.html") as f:
              parser = ScriptExtractor()
              parser.feed(f.read())
              
          if not parser.scripts:
              print("WARNING: No inline script blocks found in index.html!")
              sys.exit(1)
              
          print(f"Extracted {len(parser.scripts)} inline script blocks.")
          for i, script in enumerate(parser.scripts):
              with open(f"inline_script_{i}.js", "w") as out:
                  out.write(script)
          '
          
          echo "Checking inline JS blocks..."
          # If no files matched, the loop won"t execute if we use shopt -s nullglob
          shopt -s nullglob
          for js_file in inline_script_*.js; do
              echo "Checking $js_file..."
              node --check "$js_file"
          done

      - name: Run Tests (Server, Chrome, Python)
        shell: bash
        run: |
          set -euo pipefail
          
          # 1. Start HTTP Server
          echo "Starting HTTP Server..."
          python3 -m http.server 8765 --bind 127.0.0.1 > http_server.log 2>&1 &
          SERVER_PID=$!
          
          # 2. Start Headless Chrome
          echo "Finding Chrome binary..."
          if command -v google-chrome >/dev/null 2>&1; then
              CHROME_BIN="google-chrome"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
              CHROME_BIN="google-chrome-stable"
          else
              echo "Error: Google Chrome not found."
              exit 1
          fi
          
          echo "Runner CPU: $(lscpu | sed -n 's/^Model name: *//p') / $(nproc) cores"
          echo "Starting Headless Chrome ($CHROME_BIN)..."
          # The runner pipes kernel core dumps to systemd-coredump; a crashed renderer then sat in the kernel's
          # core-dump write indefinitely (kernel stack: vfs_coredump -> anon_pipe_write), so Chrome never
          # reported the crash and the suite hung. No core dumps: a renderer crash surfaces immediately.
          sudo -n sysctl -q -w kernel.core_pattern=core || true
          ulimit -c 0
          mkdir -p /tmp/pdf-ux-test-profile
          $CHROME_BIN --headless --enable-logging=stderr --v=0 --remote-debugging-port=9222 --user-data-dir=/tmp/pdf-ux-test-profile about:blank > chrome.log 2>&1 &
          CHROME_PID=$!
          
          # Ensure cleanup of background processes when this step exits (success or failure)
          # On failure, surface Chrome's own log (renderer crash / GPU hang reasons never reach the CDP client)
          trap "status=\$?; if [ \$status -ne 0 ]; then echo '--- chrome.log (tail) ---'; grep -E 'FATAL|Check failed|NOTREACHED|DUMP_WITHOUT|:ERROR:' chrome.log | grep -v 'dbus\|gcm\|UPower' | tail -n 40; tail -n 30 chrome.log || true; bash tests/ci_chrome_stall_dump.sh || true; fi; echo 'Stopping background services...'; kill $SERVER_PID $CHROME_PID 2>/dev/null || true" EXIT
          
          # 3. Wait for services
          echo "Waiting for HTTP server (PID $SERVER_PID) to respond on port 8765..."
          timeout 10 bash -c 'until curl -s http://127.0.0.1:8765 > /dev/null; do sleep 0.5; done'
          echo "HTTP server is running."
          
          echo "Waiting for Chrome CDP (PID $CHROME_PID) on port 9222..."
          # A cold headless Chrome on a busy runner can need well over 15s to open its DevTools port.
          timeout 45 bash -c 'until curl -s http://127.0.0.1:9222/json > /dev/null; do sleep 0.5; done'
          echo "Chrome CDP is ready."
          
          # 4. Run tests
          echo "Running pdf_ux_browser.py..."
          python3 -u tests/pdf_ux_browser.py
          python3 -u tests/pdf_pinch_anchor_browser.py

          echo "Running pdf_continuous_browser.py..."
          python3 -u tests/pdf_continuous_browser.py

          echo "Running pdf_workspace_browser.py..."
          python3 -u tests/pdf_workspace_browser.py

          echo "Running pdf_thumbnails_browser.py..."
          python3 -u tests/pdf_thumbnails_browser.py

          echo "Running pdf_workspace_regressions_browser.py..."
          python3 -u tests/pdf_workspace_regressions_browser.py

          echo "Running translation_popup_timer_browser.py..."
          python3 -u tests/translation_popup_timer_browser.py
          python3 -u tests/single_word_translation_browser.py

          echo "Running pdf_word_click_browser.py..."
          python3 -u tests/pdf_word_click_browser.py

          echo "Running pdf_page_identity_browser.py..."
          python3 -u tests/pdf_page_identity_browser.py

          echo "Running learning_ux_browser.py..."
          python3 -u tests/learning_ux_browser.py

          python3 -u tests/learning_stats_languages_grammar_browser.py

          echo "Running learning_stats_position_independence_browser.py..."
          python3 -u tests/learning_stats_position_independence_browser.py

          echo "Running reader_resize_sync_browser.py..."
          python3 -u tests/reader_resize_sync_browser.py

          echo "Running pwa_start_url_browser.py..."
          python3 -u tests/pwa_start_url_browser.py

          python3 -u tests/ai_providers_browser.py
          python3 -u tests/practice_browser.py
          python3 -u tests/practice_workspace_browser.py
          python3 -u tests/practice_reading_browser.py
          python3 -u tests/practice_allocation_browser.py
          python3 -u tests/practice_sentence_actions_browser.py
          python3 -u tests/grammar_language_isolation_browser.py
          python3 -u tests/grammar_redesign_browser.py
          python3 -u tests/grammar_french_browser.py
          python3 -u tests/grammar_selection_preserve_browser.py
          python3 -u tests/reader_repair_verification_browser.py
          python3 -u tests/ai_contract_browser.py

          python3 -u tests/quick_wheel_browser.py
          python3 -u tests/quick_wheel_drag_browser.py

          python3 -u tests/migration_audit_browser.py

          python3 -u tests/formats_browser.py

          echo "Running rich_text_formats_browser.py..."
          python3 -u tests/rich_text_formats_browser.py

          python3 -u tests/pdf_rendering_audit_browser.py
          python3 -u tests/archive_formats_audit_browser.py
          python3 -u tests/text_formats_audit_browser.py
          python3 -u tests/format_reader_audit_browser.py

          echo "Running language_paren_browser.py..."
          python3 -u tests/language_paren_browser.py

          echo "Running language_context_browser.py..."
          python3 -u tests/language_context_browser.py

          echo "Running ask_ai_language_browser.py..."
          python3 -u tests/ask_ai_language_browser.py
          python3 -u tests/ask_dictation_browser.py

          echo "Running local_translator_warmup_browser.py..."
          python3 -u tests/local_translator_warmup_browser.py

          echo "Running tts_double_voice_browser.py..."
          python3 -u tests/tts_double_voice_browser.py

          echo "Running tts_lang_voice_mismatch_browser.py..."
          python3 -u tests/tts_lang_voice_mismatch_browser.py
          python3 -u tests/tts_first_tap_browser.py

          echo "Running pdf_sentence_reselect_browser.py..."
          python3 -u tests/pdf_sentence_reselect_browser.py

          echo "Running pdf_bilingual_columns_browser.py..."
          python3 -u tests/pdf_bilingual_columns_browser.py
          python3 -u tests/bilingual_selection_browser.py

          echo "Running pdf_hitbox_stateless_browser.py..."
          python3 -u tests/pdf_hitbox_stateless_browser.py

          echo "All tests passed successfully!"

      - name: Upload Chrome crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-crash-reports
          path: |
            ~/.config/google-chrome/Crash Reports
            chrome.log
          if-no-files-found: ignore
