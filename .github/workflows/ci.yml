name: Ebook Reader CI

on:
  push:
    branches: [ "main", "dev", "staging", "test" ]
  pull_request:
    branches: [ "main" ]

# The workflow only reads the repository: its token gets no write rights.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking standalone JS files..."
          for js_file in js/*.js; do node --check "$js_file"; done
          python3 tests/app_shell_versions.py
          python3 tests/browser_cdp_transport.py
          python3 tests/ci_suite_coverage.py
          python3 tests/book_tts_columns_test.py
          python3 tests/dict_fr_uk_data.py
          node --check sw.js
          node --check archive-guard.worker.js
          node tests/shared_ai_proxy_test.mjs
          node tests/offline_model_proxy_test.mjs
          node tests/device_llm_proxy_test.mjs
          node tests/book_speech_test.mjs
          node tests/library_proxy_test.mjs
          
          echo "Checking index.html has no inline JS (CSP forbids it)..."
          python3 -c '
          import html.parser
          import sys

          class ScriptExtractor(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.scripts = []
                  self.current_script = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      is_src = any(attr[0] == "src" for attr in attrs)
                      type_attr = next((attr[1] for attr in attrs if attr[0] == "type"), "text/javascript")
                      if not is_src and type_attr in ("text/javascript", "module", "application/javascript"):
                          self.in_script = True
                          self.current_script = []
              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.in_script = False
                      self.scripts.append("".join(self.current_script))
              def handle_data(self, data):
                  if self.in_script:
                      self.current_script.append(data)

          with open("index.html") as f:
              parser = ScriptExtractor()
              parser.feed(f.read())
              
          # The production CSP (_headers) has no 'unsafe-inline' in script-src: an inline <script> or on...= attribute would
          # silently not run on the site. Fail here instead.
          import re
          scripts = [s for s in parser.scripts if s.strip()]
          handlers = re.findall(r"<[a-zA-Z][^>]*\s(on[a-z]+)\s*=", open("index.html").read())
          if scripts or handlers:
              print(f"ERROR: index.html has {len(scripts)} inline script block(s) and inline handlers {sorted(set(handlers))}; the CSP blocks them - move the code into a js/ file.")
              sys.exit(1)
          print("No inline scripts or inline event handlers in index.html (required by the CSP).")
          '
          
          echo "Checking inline JS blocks..."
          # If no files matched, the loop won"t execute if we use shopt -s nullglob
          shopt -s nullglob
          for js_file in inline_script_*.js; do
              echo "Checking $js_file..."
              node --check "$js_file"
          done

  # The browser suites (tests/ci_browser_suites.txt) run in parallel shards, each with its own server and headless Chrome
  # (2026-11-14: one job took 35-40 min; every merge of main re-ran it). tests/ci_browser_shard.py decides which suites
  # a shard runs; add new suites to tests/ci_browser_suites.txt, not here.
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run browser suites (shard ${{ matrix.shard }} of 6)
        shell: bash
        run: bash tests/ci_run_browser.sh ${{ matrix.shard }} 6

      - name: Upload Chrome crash reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-crash-reports-${{ matrix.shard }}
          path: |
            ~/.config/google-chrome/Crash Reports
            chrome.log
          if-no-files-found: ignore

  # The one check branch protection and the agents wait for, as before: green only when the checks and every shard are.
  test:
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    steps:
      - name: All checks and browser shards passed
        shell: bash
        run: |
          echo "checks: ${{ needs.checks.result }}, browser shards: ${{ needs.browser.result }}"
          test "${{ needs.checks.result }}" = success && test "${{ needs.browser.result }}" = success
