name: Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-gate:
    name: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Block edits to protected CI and governance files in PRs
        if: github.event_name == 'pull_request'
        # The branch name reaches the script as an environment variable, never pasted into the script's text
        # (Semgrep run-shell-injection: a crafted ref name would otherwise run as shell code).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(\.github/|AGENTS\.md$|GEMINI\.md$)'; then
            echo "ERROR: PR modifies protected CI/governance files (.github/, AGENTS.md, or GEMINI.md)."
            echo "Autonomous auto-merge is blocked; owner review/bypass is required."
            exit 1
          fi

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python for Semgrep
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Semgrep SAST scan (backdoors, eval, hidden network calls)
        run: |
          python -m pip install --no-cache-dir semgrep==1.185.0   # pinned: a new release cannot change the gate unseen
          semgrep scan --config auto --config p/security-audit --error .

      - name: Trivy filesystem vulnerability & config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: OSV-Scanner dependency vulnerability check (pinned CLI, SHA256-verified)
        env:
          OSV_VERSION: "2.7.1"
          OSV_SHA256: "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"
        run: |
          # osv-scanner exits 128 when no lockfile exists; skip explicitly instead of failing.
          if [ -z "$(find . -path ./.git -prune -o \( -name 'package-lock.json' -o -name 'yarn.lock' -o -name 'pnpm-lock.yaml' -o -name 'requirements*.txt' -o -name 'Pipfile.lock' -o -name 'poetry.lock' -o -name 'go.sum' -o -name 'Cargo.lock' \) -print)" ]; then
            echo "::notice::No lockfiles in repo; OSV-Scanner skipped. Vendored JS in vendor/ is not covered by this step."
            exit 0
          fi
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source -r .

      - name: Verify npm lockfile & block hidden install scripts (if package.json present)
        if: hashFiles('package.json') != ''
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const scripts = pkg.scripts || {};
            for (const hook of ["preinstall", "install", "postinstall", "prepare"]) {
              if (scripts[hook]) {
                console.error("Blocked lifecycle script in package.json:", hook, scripts[hook]);
                process.exit(1);
              }
            }
          '
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
            npm audit --audit-level=high
          fi
