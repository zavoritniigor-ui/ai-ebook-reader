name: Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-gate:
    name: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Block edits to protected CI and governance files in PRs
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(\.github/|AGENTS\.md$|GEMINI\.md$)'; then
            echo "ERROR: PR modifies protected CI/governance files (.github/, AGENTS.md, or GEMINI.md)."
            echo "Autonomous auto-merge is blocked; owner review/bypass is required."
            exit 1
          fi

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python for Semgrep
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Semgrep SAST scan (backdoors, eval, hidden network calls)
        run: |
          python -m pip install --no-cache-dir semgrep
          semgrep scan --config auto --config p/security-audit --error .

      - name: Trivy filesystem vulnerability & config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: OSV-Scanner dependency vulnerability check
        uses: google/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            -r
            .

      - name: Verify npm lockfile & block hidden install scripts (if package.json present)
        if: hashFiles('package.json') != ''
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const scripts = pkg.scripts || {};
            for (const hook of ["preinstall", "install", "postinstall", "prepare"]) {
              if (scripts[hook]) {
                console.error("Blocked lifecycle script in package.json:", hook, scripts[hook]);
                process.exit(1);
              }
            }
          '
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
            npm audit --audit-level=high
          fi
